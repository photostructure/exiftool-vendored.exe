name: Check for ExifTool Updates

on:
  schedule:
    - cron: "0 12 * * *" # Run every day at 12 PM UTC
  workflow_dispatch: # Allow manual triggering

permissions: {}

concurrency:
  group: check-updates-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-updates:
    name: Detect an ExifTool update
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Require the default branch
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/$env:DEFAULT_BRANCH") {
            Write-Error "Update checks must run from $env:DEFAULT_BRANCH, not $env:GITHUB_REF"
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check for an ExifTool update
        shell: pwsh
        run: |
          npm run check-version
          $status = $LASTEXITCODE
          if ($status -eq 1) {
            Write-Output "::error::A new ExifTool release is available. Run npm run update:exiftool locally."
          }
          exit $status
