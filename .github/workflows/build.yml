name: Build & Prepare Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version bump (patch finalizes an ExifTool -pre update)
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  test:
    name: Test Node.js ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # npm checks devEngines before every command. Allow older bundled npm
    # releases to exercise this frozen-lockfile compatibility job.
    env:
      npm_config_force: "true"

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        node-version: [22, 24, 26]

    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Install the frozen compatibility lockfile
        # Older bundled npm releases may validate this committed lockfile, but
        # must not resolve dependencies. The clean-tree check below enforces it.
        run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - name: Verify the tested source stayed unchanged
        run: git diff --exit-code

  release:
    name: Create signed release commit and tag
    runs-on: ubuntu-24.04
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    concurrency:
      group: ${{ github.repository }}-release
      cancel-in-progress: false
    permissions:
      contents: write # Push the signed release commit and annotated tag.
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # This isolated job pushes the release commit and tag. It installs no
          # dependencies and has no npm publishing authority.
          persist-credentials: true

      - name: Verify the release source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Releases must be dispatched from $DEFAULT_BRANCH, not $GITHUB_REF"
            exit 1
          fi
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if [[ "$(git rev-parse "origin/$DEFAULT_BRANCH")" != "$GITHUB_SHA" ]]; then
            echo "::error::$DEFAULT_BRANCH moved after this release run started; run it again"
            exit 1
          fi

      - name: Install the release Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Set up SSH signing
        uses: photostructure/git-ssh-signing-action@abd2a642ab7d704f66193472b47c72375d85a0c1 # v2.0.1
        with:
          ssh-signing-key: ${{ secrets.SSH_SIGNING_KEY }}
          git-user-name: ${{ secrets.GIT_USER_NAME }}
          git-user-email: ${{ secrets.GIT_USER_EMAIL }}

      - name: Bump the package version
        id: version
        env:
          BUMP: ${{ inputs.version }}
        run: |
          case "$BUMP" in
            patch|minor|major) ;;
            *)
              echo "::error::Unsupported version bump: $BUMP"
              exit 1
              ;;
          esac

          npm version "$BUMP" --no-git-tag-version --ignore-scripts

          if ! git diff --quiet -- . \
            ':(exclude)package.json' \
            ':(exclude)package-lock.json'; then
            echo "::error::The version bump changed unexpected files"
            git diff --name-only
            exit 1
          fi

          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version is not stable SemVer: $VERSION"
            exit 1
          fi
          node -e '
            const pkg = require("./package.json")
            const lock = require("./package-lock.json")
            const manifest = require("./vendor-manifest.json")
            if (lock.version !== pkg.version || lock.packages[""].version !== pkg.version) {
              throw new Error("package.json and package-lock.json versions do not match")
            }
            const [major, minor] = pkg.version.split(".")
            if (manifest.version !== major + "." + minor) {
              throw new Error("Package " + pkg.version + " does not match ExifTool " + manifest.version)
            }
          '
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create the signed release commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add package.json package-lock.json
          git commit -m "Release $VERSION"
          git tag -m "Release $VERSION" "$TAG"

      - name: Push the commit and tag atomically
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.version.outputs.tag }}
        run: git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$TAG"

  dispatch:
    name: Start tag-bound publishing
    runs-on: ubuntu-24.04
    needs: release
    permissions:
      actions: write # Dispatch publish.yaml at the validated release tag.
    steps:
      - name: Start the tag-bound publishing workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh workflow run publish.yaml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
